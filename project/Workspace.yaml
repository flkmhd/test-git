kind: Workspace
namespace:
  remote: {{remote}}
spec:
  sidecars:
    postgres:
      schema:
        create: {{run_postgres_job}}
        jobs:
          - name: k8s_job.yaml
            path: postgres/jobs
    dashboards:
      provider: superset
      create: false
      reports:
        - name: dashboard_export_20260609T161720
          path: dashboards/dashboard_export_20260609T161720.zip
        - name: dashboard_export_20260623T135205
          path: dashboards/dashboard_export_20260623T135205.zip
        - name: dashboard_export_20260609T161729
          path: dashboards/dashboard_export_20260609T161729.zip
        - name: dashboard_export_20260609T161732
          path: dashboards/dashboard_export_20260609T161732.zip
        - name: dashboard_export_20260609T161734
          path: dashboards/dashboard_export_20260609T161734.zip
        - name: dashboard_export_20260609T161737
          path: dashboards/dashboard_export_20260609T161737.zip
        - name: dashboard_export_20260609T161739
          path: dashboards/dashboard_export_20260609T161739.zip
        - name: dashboard_export_20260617T154329
          path: dashboards/dashboard_export_20260617T154329.zip
  payload:
    key: {{workspace_key}}
    name: {{workspace_name}}
    solution:
      solutionId: {{services['api.solution_id']}}
    security: {{security}}
    description: {{workspace_description}}
    version: null
    tags:
      - workspace
      - babylon
    additionalData:
      webapp:
        disableOutOfSyncWarningBanner: true
        solution:
          runTemplateFilter: null
          defaultRunTemplateDataset: null
        charts:
          workspaceId: {{powerbi['workspace_id']}}
          logInWithUserCredentials: false
          scenarioViewIframeDisplayRatio: 3.142857145
          dashboardsViewIframeDisplayRatio: 1.610062893
          useWebappTheme: false
          dashboardsView:
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: {{powerbi['dashboard_view']['bagages']}}
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Baggage
                fr: Bagages
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: {{powerbi['dashboard_view']['sous_fonctions']}}
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Subfunctions
                fr: Sous-fonctions
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: {{powerbi['dashboard_view']['expert']}}
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Expert
                fr: Expert
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: {{powerbi['dashboard_view']['overview_comparison']}}
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Overview comparison
                fr: Comparaison de scénarios
          scenarioView:
            basic_simulation:
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              reportId: {{powerbi['scenario_view']['basic_simulation']}}
              title:
                en: Scenario view
                fr: Vue scenario
              dynamicFilters:
                - values: lastRunId
                  column: last_csm_run_id
                  table: GetScenarios
            baggage_logistics_and_generation:
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              reportId: {{powerbi['scenario_view']['baggage_logistics_and_generation']}}
              title:
                en: Scenario view
                fr: Vue scenario
              dynamicFilters:
                - values: lastRunId
                  column: last_csm_run_id
                  table: GetScenarios
            flights_and_baggage_assignment:
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              reportId: {{powerbi['scenario_view']['flights_and_baggage_assignment']}}
              title:
