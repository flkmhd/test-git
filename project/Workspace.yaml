                en: Scenario view
                fr: Vue scenario
              dynamicFilters:
                - values: lastRunId
                  column: last_csm_run_id
                  table: GetScenarios
        menu:
          documentationUrl: https://portal.cosmotech.com/resources/custom-solutions/cosmo-tech-adp/cosmo-tech-adp-tri-bagages-phase-2
