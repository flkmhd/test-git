kind: Workspace
namespace:
  remote: {{remote}}
spec:
  sidecars:
    postgres:
      schema:
        create: {{run_postgres_job}}
        jobs:
          - name: k8s_job.yaml
            path: postgres/jobs
  payload:
    key: {{workspace_key}}
    name: {{workspace_name}}
    solution:
      solutionId: {{services['api.solution_id']}}
    security: {{security}}
    description: {{workspace_description}}
    version: null
    tags:
      - workspace
      - babylon
    additionalData:
      webapp:
        disableOutOfSyncWarningBanner: true
        solution: {}
        charts:
          workspaceId: {{powerbi['workspace_id']}}
          logInWithUserCredentials: false
          scenarioViewIframeDisplayRatio: 3.142857145
          dashboardsViewIframeDisplayRatio: 1.610062893
          useWebappTheme: false
          dashboardsView:
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: d53f0770-f686-46d6-86a0-f614981fc41d
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Baggage
                fr: Bagages
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: 2271530b-4880-413b-993e-235ca417f8b1
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Subfunctions
                fr: Sous-fonctions
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: f935d561-aa9f-4d93-9807-3307d7221a8b
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Expert
                fr: Expert
            - dynamicFilters:
                - column: last_csm_run_id
                  table: GetScenarios
                  values: visibleScenariosLastRunIds
              reportId: ea37fb8f-5e85-4ef4-b847-81bbabd2f7ee
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              title:
                en: Overview comparison
                fr: Comparaison de scénarios
          scenarioView:
            basic_simulation:
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              reportId: {{powerbi['scenario_view']['basic_simulation']}}
              title:
                en: Scenario view
                fr: Vue scenario
              dynamicFilters:
                - values: lastRunId
                  column: last_csm_run_id
                  table: GetScenarios
            baggage_logistics_and_generation:
              settings:
                navContentPaneEnabled: false
                panes:
                  filters:
                    expanded: false
                    visible: true
              reportId: {{powerbi['scenario_view']['baggage_logistics_and_generation']}}
              title:
                en: Scenario view
                fr: Vue scenario
              dynamicFilters:
                - values: lastRunId
                  column: last_csm_run_id
                  table: GetScenarios
            flights_and_baggage_assignment:
