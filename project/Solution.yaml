        parameterGroups:
          - flights_and_baggage_assignment_parameters
          - flights_and_baggage_assignment_dataset
          - flights_and_baggage_assignment_fixed_data
          - flights_and_baggage_assignment_output
          - hidden_interactiveMap
        name: Génération des vols et affectation des bagages
        labels: null
        description: null
        tags: null
        computeSize: basic
        runSizing:
          requests:
            cpu: '1'
            memory: 4Gi
          limits:
            cpu: '1'
            memory: 4Gi
        executionTimeout: null
      - id: upload_dataset
        parameterGroups:
          - etl_input_json_file
        name: Chargement de jeu de données
        labels:
          en: JSON dataset upload
          fr: Chargement de jeu de données JSON
        description: null
        tags:
          - ETL
          - datasource
          - interactive map
        computeSize: basic
        runSizing:
          requests:
            cpu: '1'
            memory: 4Gi
          limits:
            cpu: '1'
            memory: 4Gi
