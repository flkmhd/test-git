kind: Solution
namespace:
  remote: {{remote}}
metadata:
  selector:
    organization_id: {{services['api.organization_id']}}
spec:
  sidecars: null
  payload:
    key: {{solution_key}}
    name: {{solution_name}}
    repository: {{simulator_repository}}
    version: {{simulator_version}}
    parameters:
      - id: default_model_parameters
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Model parameters
          fr: Paramètres du modèle
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Model parameters
          defaultFileTypeFilter: .csv
          shouldRenameFileOnUpload: true
      - id: Baggage_pivot
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Baggage file
          fr: Liste des bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: La liste des bagages
          defaultFileTypeFilter: .csv
          shouldRenameFileOnUpload: true
      - id: Baggage_pivot_editable_table
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Baggage file
          fr: Liste des bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          subType: TABLE
          description: La liste des bagages
          canChangeRowsNumber: true
          hasHeader: true
          dateFormat: yyyy-MM-dd HH:mm:ss
          defaultFileTypeFilter: .csv
          columns:
            - field: BagID
              headerName: Identifiant bagage
              type:
                - string
            - field: Typology
              headerName: Typologie Apport
              type:
                - string
              acceptsEmptyFields: true
            - field: SecurityStatus
              headerName: Statut initial de sécurité
              type:
                - enum
              enumValues:
                - Pending
                - Clear
            - field: InboundFlightID
              headerName: Clé de vol apport
              type:
                - string
              acceptsEmptyFields: true
            - field: InboundFlightTime
              headerName: Heure vol apport
              type:
                - date
              acceptsEmptyFields: true
            - field: OutboundFlightID
              headerName: Clé de vol emport
              type:
                - string
            - field: OutboundFlightTime
              headerName: Heure vol Emport
              type:
                - date
              acceptsEmptyFields: true
            - field: GalleryEntryTime
              headerName: Heure entrée en galerie
              type:
                - date
              acceptsEmptyFields: true
            - field: EntrySubfunction
              headerName: Sous-fonction dépose
              type:
                - string
            - field: EntryTime
              headerName: Heure de dépose
              type:
                - date
            - field: DestinationModule
              headerName: Module de destination
              type:
                - string
            - field: DestinationSubfunction
              headerName: Sous-fonction de destination
              type:
                - string
            - field: FinalSortingPointOpeningTime
              headerName: Ouverture PFT
              type:
                - date
            - field: FinalSortingPointLastMinuteTime
              headerName: Fermeture PFT
              type:
                - date
            - field: FinalSortingPointClosingTime
              headerName: Fermeture DM
              type:
                - date
      - id: interactiveMap
        varType: string
        description: null
        labels: null
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData: null
      - id: date
        varType: date
        description: null
        labels:
          en: Simulation date
          fr: Date de simulation
        defaultValue: '2030-01-01T00:00:00.000Z'
        minValue: null
        maxValue: null
        additionalData: null
      - id: bin_management
        varType: bool
        description: null
        labels:
          en: Activate empty bin management
          fr: Activation de la gestion des bacs vides
        defaultValue: 'true'
        minValue: null
        maxValue: null
        additionalData: null
      - id: max_primary_control_recirculations
        varType: int
        description: null
        labels:
          en: Max primary control recirculations
          fr: Nombre maximum de recirculations au contrôle primaire
        defaultValue: '10'
        minValue: '0'
        maxValue: null
        additionalData: null
      - id: minimum_connection_time
        varType: int
        description: null
        labels:
          en: Minimum connection time
          fr: Temps de correspondance minimum
        defaultValue: '60'
        minValue: '0'
        maxValue: null
        additionalData: null
      - id: flights_and_baggage_assignment_dataset
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Flights and baggage assignment dataset
          fr: Données de vol et d'affectation des bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Données de vol et d'affectation des bagages
          defaultFileTypeFilter: .xlsx
          hidden: false
      - id: flights_and_baggage_assignment_fixed_data
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Flights and baggage assignment fixed data
          fr: Données fixes de vol et d'affectation des bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Données fixes de vol et d'affectation des bagages
          defaultFileTypeFilter: .xlsx
          shouldRenameFileOnUpload: true
          hidden: true
      - id: flights_and_baggage_assignment_output
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Flights and baggage assignment output
          fr: Résultats de l'affectation des vols et des bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Résultats de l'affectation des vols et des bagages
          defaultFileTypeFilter: .xlsx
          shouldRenameFileOnUpload: true
      - id: etl_input_json_file
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Input JSON file
          fr: Fichier JSON d'entrée
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Fichier JSON d'entrée représentant la carte interactive
          defaultFileTypeFilter: .json
          shouldRenameFileOnUpload: true
          hidden: true
      - id: baggage_logistics_and_generation_dataset
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Baggage logistics and generation dataset
          fr: Données de logistique et génération des bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Données de logistique et génération des bagages
          defaultFileTypeFilter: .xlsx
          hidden: false
      - id: Flight_info
        varType: '%DATASET_PART_ID_FILE%'
        description: Information on inbound and outbound flights
        labels:
          en: Flight info
          fr: Info vols
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          shouldRenameFileOnUpload: false
          tooltipText: Upload the Flight info sheet with information on all inbound and outbound flights
      - id: Baggage_path_AF
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Baggage path overview
          fr: Chemin des bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          shouldRenameFileOnUpload: false
      - id: ScenarioName
        varType: string
        description: Hidden parameter to force webapp refresh
        labels:
          en: ScenarioName
          fr: ScenarioName
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          hidden: true
      - id: Flight_program
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Flight programme
          fr: Programme de vols
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          defaultFileTypeFilter: .xlsx,.csv,.xlsx,.xls
          shouldRenameFileOnUpload: false
      - id: Baggage_flux_parameters
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Baggage flux parameters
          fr: Paramétrage des flux de bagages
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          defaultFileTypeFilter: .xlsx
          shouldRenameFileOnUpload: false
      - id: generation_simulation_output
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels: {}
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          shouldRenameFileOnUpload: false
      - id: Pre_sorting
        varType: '%DATASET_PART_ID_FILE%'
        description: Fichier pré-tri dans le format AF. Un seul onglet visible qui commence avec APPORT, un seul visible qui commence avec EMPORT, et tous les onglets des plages doivent commencer par P et avoir des chiffres ensuite (rien d'autre)
        labels:
          en: Pre-sorting file
          fr: Fichier pré-tri (AF)
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          defaultFileTypeFilter: .xlsx
          shouldRenameFileOnUpload: false
      - id: baggages3_1_upload
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Upload
          fr: Chargements
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Charger le fichier de bagages au format version 3.1
          defaultFileTypeFilter: .csv,.xlsx
          shouldRenameFileOnUpload: true
      - id: baggages4_1_download
        varType: '%DATASET_PART_ID_FILE%'
        description: null
        labels:
          en: Download
          fr: Téléchargement
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          description: Télécharger le fichier de bagages converti au format version 4.1
          defaultFileTypeFilter: .csv
          shouldRenameFileOnUpload: true
      - id: remove_capacity_limit
        varType: bool
        description: null
        labels:
          en: Ignore transport and subfunction capacities
          fr: Ignorer les capacités de transport et de sous-fonction
        defaultValue: 'false'
        minValue: null
        maxValue: null
        additionalData:
          tooltipText:
            en: Useful when there are blocked bags, only to be used for debugging purposes.
            fr: Utile lorsqu'il y a des bagages bloqués, à utiliser uniquement à des fins de débogage.
      - id: Logistics_parameters
        varType: '%DATASET_PART_ID_FILE%'
        description: |-
          Onglets requis:
          - DistributionTypologies
          - TempsMoyenAvionGalerie
          - TempsMaxAttenteDepose
          - ManutentionDepose
          - FenetreEnregistrement
        labels:
          en: Logistics parameters
          fr: Paramètres logistiques
        defaultValue: null
        minValue: null
        maxValue: null
        additionalData:
          defaultFileTypeFilter: .xlsx,.xls
          shouldRenameFileOnUpload: false
    parameterGroups:
      - id: etl_input_json_file
        parameters:
          - etl_input_json_file
        description: null
        labels:
          en: Input JSON file
          fr: Fichier JSON d'entrée
        additionalData: null
      - id: default_model_parameters
        parameters:
          - default_model_parameters
          - ScenarioName
        description: null
        labels:
          en: Model parameters
          fr: Paramètres du modèle
        additionalData:
          hidden: true
      - id: baggage_file
        parameters:
          - Baggage_pivot_editable_table
        description: null
        labels:
          en: Baggage file
          fr: Fichier de bagages
        additionalData: null
      - id: interactiveMap
        parameters:
          - interactiveMap
        description: null
        labels:
          en: Interactive map
          fr: Carte interactive
        additionalData: null
      - id: common_parameters
        parameters:
          - date
          - bin_management
          - remove_capacity_limit
          - max_primary_control_recirculations
        description: null
        labels:
          en: Simulation parameters
          fr: Paramètres de simulation
        additionalData: null
      - id: baggage_basic
        parameters:
          - Baggage_pivot
        description: null
        labels:
          en: Baggage
          fr: Bagages
        additionalData: null
      - id: baggage_detailed
        parameters:
          - Baggage_pivot_editable_table
        description: null
        labels:
          en: Baggage
          fr: Bagages
        additionalData: null
      - id: flights_and_baggage_assignment_parameters
        parameters:
          - date
          - minimum_connection_time
        description: null
        labels:
          en: Parameters
          fr: Paramètres
        additionalData: null
      - id: flights_and_baggage_assignment_dataset
        parameters:
          - flights_and_baggage_assignment_dataset
        description: null
        labels:
          en: Input data
          fr: Données d'entrée
        additionalData: null
      - id: flights_and_baggage_assignment_fixed_data
        parameters:
          - flights_and_baggage_assignment_fixed_data
        description: null
        labels:
          en: Fixed data
          fr: Données fixes
        additionalData:
          hidden: true
      - id: flights_and_baggage_assignment_output
        parameters:
          - flights_and_baggage_assignment_output
        description: null
        labels:
          en: Results
          fr: Résultats
        additionalData: null
      - id: hidden_data_for_baggage_logistics
        parameters:
          - flights_and_baggage_assignment_dataset
          - flights_and_baggage_assignment_fixed_data
          - flights_and_baggage_assignment_output
          - default_model_parameters
          - date
        description: null
        labels:
          en: Inherited and fixed data for logistics
          fr: Données héritées et fixes pour la logistique
        additionalData:
          hidden: true
      - id: baggage_logistics_and_generation_dataset
        parameters:
          - baggage_logistics_and_generation_dataset
        description: null
        labels:
          en: Logistics data
          fr: Données de logistique
        additionalData: null
      - id: baggage_logistics_and_generation_output
        parameters:
          - Baggage_pivot
        description: null
        labels:
          en: Logistics output
          fr: Résultats Schéma Logistique
        additionalData: null
      - id: hidden_interactiveMap
        parameters:
          - interactiveMap
        description: null
        labels:
          en: Interactive map
          fr: Carte interactive
        additionalData:
          hidden: true
      - id: hidden_date
        parameters:
          - date
        description: null
        labels:
          en: Simulation date
          fr: Date de simulation
        additionalData:
          hidden: true
      - id: bagages-vols
        parameters:
          - Baggage_pivot
          - Flight_info
        description: null
        labels:
          en: Baggage and flights
          fr: Bagages et vols
        additionalData: null
      - id: simulation_af_output
        parameters:
          - Baggage_path_AF
        description: null
        labels:
          en: Results
          fr: Résultats
        additionalData: null
      - id: hidden_baggage_editable_table
        parameters:
          - Baggage_pivot_editable_table
        description: null
        labels: null
        additionalData:
          hidden: true
      - id: gene_simu_inputs
        parameters:
          - Flight_program
          - Baggage_flux_parameters
          - minimum_connection_time
          - Pre_sorting
          - Logistics_parameters
        description: null
        labels:
          en: Inputs
          fr: Entrées
        additionalData: null
      - id: gene_simu_outputs
        parameters:
          - generation_simulation_output
        description: null
        labels:
          en: Result
          fr: Résultat
        additionalData: null
      - id: baggages3_1_upload
        parameters:
          - baggages3_1_upload
        description: null
        labels:
          en: Baggage v3.1
          fr: Bagages v3.1
        additionalData: null
      - id: baggages4_1_download
        parameters:
          - baggages4_1_download
        description: null
        labels:
          en: Baggage v4.1
          fr: Bagages v4.1
        additionalData: null
    runTemplates:
      - id: basic_simulation
        parameterGroups:
          - default_model_parameters
          - common_parameters
          - baggage_basic
          - interactiveMap
        name: Simulation simple
        labels: null
        description: null
        tags: null
        computeSize: basic
        runSizing:
          requests:
            cpu: '1'
            memory: 4Gi
          limits:
            cpu: '1'
            memory: 4Gi
        executionTimeout: null
      - id: detailed_simulation
        parameterGroups:
          - default_model_parameters
          - common_parameters
          - baggage_detailed
          - interactiveMap
        name: Simulation détaillée
        labels: null
        description: null
        tags: null
        computeSize: basic
        runSizing:
          requests:
            cpu: '1'
            memory: 4Gi
          limits:
            cpu: '1'
            memory: 4Gi
