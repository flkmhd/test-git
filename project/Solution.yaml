        parameterGroups:
          - common_parameters
          - bagages-vols
          - default_model_parameters
          - interactiveMap
          - simulation_af_output
        name: Simulation AF
        labels: null
        description: Simulation Air France
        tags: []
        computeSize: null
        runSizing: null
        executionTimeout: null
